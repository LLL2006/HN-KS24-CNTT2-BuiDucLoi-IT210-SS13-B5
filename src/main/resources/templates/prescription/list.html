<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Quản lý Đơn thuốc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="container py-4">
<div class="card shadow">
    <div class="card-header bg-primary text-white d-flex justify-content-between">
        <h4 class="mb-0">Quản Lý Đơn Thuốc</h4>
        <a th:href="@{/prescription/add}" class="btn btn-light btn-sm">Thêm Đơn</a>
    </div>
    <div class="card-body">
        <table class="table table-hover border">
            <thead class="table-dark">
            <tr>
                <th>ID</th><th>Mã BN</th><th>Bệnh Nhân</th><th>Chi Tiết Thuốc</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${list}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.patientCode}" class="fw-bold"></td>
                <td th:text="${p.patientName}"></td>
                <td>
                            <span class="badge bg-info text-dark me-1"
                                  th:each="d : ${p.details}"
                                  th:text="${d.medicineName + ' (x' + d.quantity + ')'}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
